services:
  mysql:
    image: mysql:8.4
    container_name: instantpay-mysql
    environment:
      - 'MYSQL_DATABASE=instantpay'
      - 'MYSQL_PASSWORD=instantpay'
      - 'MYSQL_ROOT_PASSWORD=root'
      - 'MYSQL_USER=instantpay'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
